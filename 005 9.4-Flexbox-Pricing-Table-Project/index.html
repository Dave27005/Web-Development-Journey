<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: rgb(228, 228, 228);
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .pricing-container{
        display: flex;
        gap: 10px;
        justify-content: center;
        height: 100vh; 
        align-items: center; 
      }
      .pricing-plan {     
        background-color: rgb(206, 206, 206);
        width: 300px;
        height: 240px;
        padding: 0px 0px 0px 0px;
        border-radius: 3px;

      }

      .plan-price{
        text-align: center;
        font-size: 2rem;
      }
      .plan-title {
        background-color: rgb(23, 126, 23);
        color: rgb(255, 255, 255);
        font-weight: bold;  
        font-size: 2rem;
        text-align: center;
        border-radius: 3px;
      }

      .planbutton{
        display: flex;
        justify-content: center;
      }

      .plan-button {
        font-weight: bold;
        font-size: 15px;
        padding: 10px;
        color: white;
        background-color:   rgb(23, 126, 23);
        border: none;
        border-radius: 20px;
        width: 10rem;
      }

      .price {
        font-weight:500;
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 931px) and (min-width: 319px){
        .pricing-container {
          flex-direction: column;
          height: 100%;
        }

      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>    
        <div class="plan-price"><span class="price">$9.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul> 
        <div class="planbutton">
          <button class="plan-button">Sign Up</button>
      </div>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>    
        <div class="plan-price"><span class="price">$19.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <div class="planbutton">
          <button class="plan-button">Sign Up</button>
      </div>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>   
        <div class="plan-price"><span class="price">$49.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <div class="planbutton">
          <button class="plan-button">Sign Up</button>
      </div>
      </div>
    </div>
  </body>
</html>
